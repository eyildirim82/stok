services:
  db:
    image: postgres:15-alpine
    container_name: envanter_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-envanter_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - envanter_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-envanter_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./envanter_api
      dockerfile: Dockerfile
    container_name: envanter_api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev_only_change_me}@db:5432/${POSTGRES_DB:-envanter_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "3001:3001"
    volumes:
      - ./envanter_api:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - envanter_network
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        npm ci &&
        npx prisma migrate dev --name init &&
        npm run dev
      "

  ui:
    build:
      context: ./envanter_ui
      dockerfile: Dockerfile
    container_name: envanter_ui
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
      VITE_APP_NAME: Envanter Yönetim Sistemi
      VITE_APP_VERSION: 1.0.0
      VITE_NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./envanter_ui:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - envanter_network
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: envanter_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - ui
    networks:
      - envanter_network

volumes:
  postgres_data:
    driver: local

networks:
  envanter_network:
    driver: bridge
