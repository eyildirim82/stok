name: Dependency Audit Investigation

on:
  push:
    branches:
      - chore/dependency-audit
    paths:
      - 'envanter_api/package*.json'
      - 'envanter_ui/package*.json'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh UI lockfile
        working-directory: envanter_ui
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
          npm ci

      - name: Verify UI dependencies
        working-directory: envanter_ui
        run: |
          npm audit --omit=dev
          npm audit
          npm run typecheck
          npm run build

      - name: Refresh API lockfile
        working-directory: envanter_api
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only || true
          npm ci

      - name: Record API lockfile audit
        working-directory: envanter_api
        continue-on-error: true
        run: npm audit

      - name: Verify API production install excludes vulnerable Prisma tooling
        working-directory: envanter_api
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          if npm ls --omit=dev --all deepmerge-ts >/tmp/deepmerge-prod-tree.txt 2>&1; then
            cat /tmp/deepmerge-prod-tree.txt
            echo "deepmerge-ts unexpectedly exists in the production install"
            exit 1
          fi
          cat /tmp/deepmerge-prod-tree.txt || true
          echo "Verified: deepmerge-ts is absent from npm ci --omit=dev production install."

      - name: Commit verified lockfiles
        run: |
          if git diff --quiet -- envanter_ui/package.json envanter_ui/package-lock.json envanter_api/package.json envanter_api/package-lock.json; then
            echo "No dependency lockfile changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add envanter_ui/package.json envanter_ui/package-lock.json envanter_api/package.json envanter_api/package-lock.json
          git commit -m "chore(deps): refresh audited lockfiles [skip ci]"
          git push origin HEAD:chore/dependency-audit
