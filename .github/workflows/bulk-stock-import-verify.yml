name: Bulk Stock Import Verify

on:
  push:
    branches:
      - feat/bulk-stock-import
    paths:
      - '.github/workflows/bulk-stock-import-verify.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d inventory_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test?schema=public
      JWT_SECRET: bulk-import-ci-secret-with-sufficient-length
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/bulk-stock-import

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wire frontend upload service
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('envanter_ui/src/services/api.ts')
          text = path.read_text()

          old_client = """const api = axios.create({\n  baseURL: API_BASE_URL,\n  timeout: 10000,\n  headers: {\n    'Content-Type': 'application/json',\n  },\n});\n"""
          new_client = """const api = axios.create({\n  baseURL: API_BASE_URL,\n  timeout: 10000,\n});\n"""
          if text.count(old_client) != 1:
              raise SystemExit('Axios client configuration did not match expected source')
          text = text.replace(old_client, new_client)

          old_upload = """    uploadEntry: async (_fileData: FormData): Promise<{ data?: { processed?: number } }> => {\n      throw new Error('Toplu stok yükleme backend tarafından henüz desteklenmiyor.');\n    },\n"""
          new_upload = """    uploadEntry: async (fileData: FormData): Promise<{\n      success: boolean;\n      message: string;\n      data?: { importId?: number; processed?: number; ignoredColumns?: string[] };\n    }> => {\n      const response = await api.post('/api/stock-movements/upload-entry', fileData);\n      return response.data;\n    },\n"""
          if text.count(old_upload) != 1:
              raise SystemExit('Bulk upload service did not match expected source')
          path.write_text(text.replace(old_upload, new_upload))
          PY

      - name: Install import dependencies
        working-directory: envanter_api
        run: npm install --save exceljs@latest multer@latest

      - name: Audit backend dependencies
        working-directory: envanter_api
        run: npm audit

      - name: Generate Prisma client
        working-directory: envanter_api
        run: npx prisma generate

      - name: Validate Prisma schema
        working-directory: envanter_api
        run: npx prisma validate

      - name: Apply committed migrations
        working-directory: envanter_api
        run: npx prisma migrate deploy

      - name: Run backend integration tests
        working-directory: envanter_api
        run: npm test

      - name: Verify UI
        working-directory: envanter_ui
        run: |
          npm ci
          npm audit
          npm run typecheck
          npm run build

      - name: Commit verified dependency and service changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add envanter_api/package.json envanter_api/package-lock.json envanter_ui/src/services/api.ts
          git diff --cached --check
          git commit -m "feat(import): wire verified CSV/XLSX dependencies [skip ci]"
          git push origin HEAD:feat/bulk-stock-import
