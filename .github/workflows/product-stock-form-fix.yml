name: Product Stock Form Fix

on:
  push:
    branches:
      - fix/product-stock-form
    paths:
      - '.github/workflows/product-stock-form-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/product-stock-form

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch product stock form
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub(path, pattern, replacement, expected=1):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE | re.DOTALL)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {count}')
              p.write_text(updated)

          # Shared product mutation type contains metadata/prices only.
          sub(
              'envanter_ui/src/types/index.ts',
              r'(export interface ProductFormData \{.*?listeFiyati: number;\n)  mevcutMiktar: number;\n(\})',
              r'\1\2',
          )

          # Product API service no longer reads or sends stock in product mutations.
          sub(
              'envanter_ui/src/services/api.ts',
              r"    create: async \(productData: ProductFormData\) => \{.*?(?=    delete: async \(id: number\) =>)",
              """    create: async (productData: ProductFormData) => {\n      const response = await api.post<ProductMutationResponse>('/api/products', productData);\n      return response.data;\n    },\n\n    update: async (id: number, productData: Partial<ProductFormData>) => {\n      const response = await api.put<ProductMutationResponse>(`/api/products/${id}`, productData);\n      return response.data;\n    },\n\n""",
          )

          page = Path('envanter_ui/src/pages/ProductPage.tsx')
          text = page.read_text()
          text, count = re.subn(
              r'(interface ProductFormData \{.*?listeFiyati: number;\n)  mevcutMiktar: number;\n(\})',
              r'\1\2', text, count=1, flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'ProductPage interface: expected 1 match, got {count}')

          text, count = re.subn(r'^\s+mevcutMiktar: 0,?\n', '', text, flags=re.MULTILINE)
          if count != 2:
              raise SystemExit(f'ProductPage zero-stock form state: expected 2 matches, got {count}')

          text, count = re.subn(r'^\s+mevcutMiktar: product\.mevcutMiktar,?\n', '', text, flags=re.MULTILINE)
          if count != 1:
              raise SystemExit(f'ProductPage edit stock form state: expected 1 match, got {count}')

          stock_pattern = r'''                <div>\n                  <label className="block text-sm font-medium text-gray-700 mb-1">\n                    Mevcut Miktar\n                  </label>\n                  <input\n                    type="number"\n                    min="0"\n                    value=\{formData\.mevcutMiktar\}\n                    onChange=\{\(e\) => setFormData\(prev => \(\{ \.\.\.prev, mevcutMiktar: parseInt\(e\.target\.value\) \|\| 0 \}\)\)\}\n                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"\n                  />\n                </div>'''
          stock_context = '''                <div className="rounded-md border border-blue-200 bg-blue-50 px-3 py-2">\n                  {isEditMode && editingProduct ? (\n                    <>\n                      <div className="flex items-center justify-between">\n                        <span className="text-sm font-medium text-blue-900">Mevcut Stok</span>\n                        <span className="text-sm font-semibold text-blue-900">\n                          {formatNumber(editingProduct.mevcutMiktar)}\n                        </span>\n                      </div>\n                      <p className="mt-1 text-xs text-blue-700">\n                        Stok miktarı yalnızca stok hareketleri üzerinden değiştirilebilir.\n                      </p>\n                    </>\n                  ) : (\n                    <p className="text-sm text-blue-800">\n                      Yeni ürün 0 stokla oluşturulur. İlk stok girişini ürünü oluşturduktan sonra stok hareketi üzerinden kaydedin.\n                    </p>\n                  )}\n                </div>'''
          text, count = re.subn(stock_pattern, stock_context, text, count=1)
          if count != 1:
              raise SystemExit(f'ProductPage editable stock input: expected 1 match, got {count}')
          if 'formData.mevcutMiktar' in text:
              raise SystemExit('ProductPage still contains editable stock form reference')
          page.write_text(text)

          # One remaining PUT route comment still lists stock; remove it.
          sub(
              'envanter_api/routes/products.js',
              r' \* @body    urunKodu, kategori, alisFiyati, listeFiyati, mevcutMiktar\n',
              ' * @body    urunKodu, kategori, alisFiyati, listeFiyati\n',
          )

          # Integration client helper follows the metadata-only create contract.
          sub(
              'envanter_api/test/integration/stock-movements.test.js',
              r'(      alisFiyati: 10,\n      listeFiyati: 20,\n)      mevcutMiktar: 0,\n',
              r'\1',
          )

          tests = Path('envanter_api/test/integration/stock-movements.test.js')
          text = tests.read_text()
          marker = "test('product update cannot mutate stock quantity directly', async () => {"
          if text.count(marker) != 1:
              raise SystemExit('product update regression marker mismatch')
          new_test = '''test('product creation cannot initialize stock without a movement', async () => {\n  const { response, body } = await api('/api/products', {\n    method: 'POST',\n    body: JSON.stringify({\n      urunKodu: 'INT-DIRECT-INITIAL-STOCK',\n      kategori: 'Integration Test',\n      alisFiyati: 10,\n      listeFiyati: 20,\n      mevcutMiktar: 5,\n    }),\n  });\n\n  assert.equal(response.status, 400, JSON.stringify(body));\n  assert.equal(body.error, 'STOCK_UPDATE_REQUIRES_MOVEMENT');\n  assert.equal(await prisma.product.count({\n    where: { urunKodu: 'INT-DIRECT-INITIAL-STOCK' },\n  }), 0);\n});\n\n'''
          tests.write_text(text.replace(marker, new_test + marker, 1))
          PY

      - name: Verify UI
        working-directory: envanter_ui
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add envanter_ui/src/pages/ProductPage.tsx envanter_ui/src/types/index.ts envanter_ui/src/services/api.ts envanter_api/routes/products.js envanter_api/test/integration/stock-movements.test.js
          git diff --cached --check
          git commit -m "fix(ui): make product stock read-only [skip ci]"
          git push origin HEAD:fix/product-stock-form
