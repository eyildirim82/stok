name: Finalize Bulk Import Contract

on:
  push:
    branches:
      - feat/bulk-stock-import
    paths:
      - '.github/workflows/bulk-import-contract-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bulk-stock-import

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add processed and error counts to import responses
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          controller = 'envanter_api/controllers/bulkStockImportController.js'

          replace_once(
              controller,
              "        data: { errors: validation.errors },\n",
              "        data: {\n          processed: 0,\n          errorCount: validation.errors.length,\n          errors: validation.errors,\n        },\n",
          )

          replace_once(
              controller,
              "        processed: result.rowCount,\n        ignoredColumns: parsed.unknownHeaders,\n",
              "        processed: result.rowCount,\n        errorCount: 0,\n        ignoredColumns: parsed.unknownHeaders,\n",
          )

          replace_once(
              controller,
              "        data: error.details,\n      });\n",
              "        data: {\n          processed: 0,\n          errorCount: Array.isArray(error.details?.errors) ? error.details.errors.length : 0,\n          ...(error.details || {}),\n        },\n      });\n",
          )

          test_file = 'envanter_api/test/integration/bulk-stock-import.test.js'
          replace_once(
              test_file,
              "  assert.equal(body.data.processed, 2);\n",
              "  assert.equal(body.data.processed, 2);\n  assert.equal(body.data.errorCount, 0);\n",
          )
          replace_once(
              test_file,
              "  assert.equal(body.error, 'IMPORT_INSUFFICIENT_STOCK');\n  assert.equal(body.data.errors[0].row, 3);\n",
              "  assert.equal(body.error, 'IMPORT_INSUFFICIENT_STOCK');\n  assert.equal(body.data.processed, 0);\n  assert.equal(body.data.errorCount, 1);\n  assert.equal(body.data.errors[0].row, 3);\n",
          )
          replace_once(
              test_file,
              "  assert.equal(body.error, 'IMPORT_VALIDATION_FAILED');\n  assert.equal(body.data.errors[0].code, 'PRODUCT_NOT_FOUND');\n",
              "  assert.equal(body.error, 'IMPORT_VALIDATION_FAILED');\n  assert.equal(body.data.processed, 0);\n  assert.equal(body.data.errorCount, 1);\n  assert.equal(body.data.errors[0].code, 'PRODUCT_NOT_FOUND');\n",
          )
          PY

      - name: Verify backend dependency audit and syntax
        working-directory: envanter_api
        run: |
          npm ci
          npm audit --omit=dev
          npm audit
          npx prisma generate
          node --check controllers/bulkStockImportController.js
          node --check services/stockImportParser.js
          node --check test/integration/bulk-stock-import.test.js

      - name: Verify UI
        working-directory: envanter_ui
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit verified contract changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add envanter_api/controllers/bulkStockImportController.js envanter_api/test/integration/bulk-stock-import.test.js
          git diff --cached --check
          git commit -m "test(import): expose processed and error counts [skip ci]"
          git push origin HEAD:feat/bulk-stock-import
