name: Finalize Decimal Inventory Aggregate

on:
  push:
    branches:
      - fix/decimal-inventory-aggregate
    paths:
      - '.github/workflows/decimal-aggregate-finalize.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/decimal-inventory-aggregate

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch decimal aggregate flow and regression coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          controller = 'envanter_api/controllers/productController.js'
          old_stats = '''const getProductStats = async (req, res) => {\n  try {\n    const totalProducts = await prisma.product.count();\n    const totalValue = await prisma.product.aggregate({\n      _sum: {\n        mevcutMiktar: true\n      }\n    });\n\n    const totalStockValue = await prisma.product.aggregate({\n      _sum: {\n        alisFiyati: true\n      }\n    });\n\n    const categoryStats = await prisma.product.groupBy({\n      by: ['kategori'],\n      _count: {\n        id: true\n      },\n      _sum: {\n        mevcutMiktar: true\n      }\n    });\n\n    res.json({\n      success: true,\n      data: {\n        totalProducts,\n        totalStockQuantity: totalValue._sum.mevcutMiktar || 0,\n        totalStockValue: totalStockValue._sum.alisFiyati || 0,\n        categoryStats\n      }\n    });\n\n  } catch (error) {\n    console.error('Get product stats error:', error);\n    res.status(500).json({\n      success: false,\n      message: 'İstatistikler getirilirken hata oluştu',\n      error: 'INTERNAL_ERROR'\n    });\n  }\n};\n'''
          new_stats = '''const getProductStats = async (req, res) => {\n  try {\n    // Inventory value is calculated in PostgreSQL so Decimal prices are multiplied\n    // and summed as exact fixed-point values before crossing the JSON boundary.\n    const [summary] = await prisma.$queryRaw`\n      SELECT\n        COUNT(*) AS "totalProducts",\n        COALESCE(SUM("mevcutMiktar"), 0)::bigint AS "totalStockQuantity",\n        COALESCE(SUM("alisFiyati" * "mevcutMiktar"), 0)::numeric(20,2) AS "totalStockValue",\n        COUNT(*) FILTER (WHERE "mevcutMiktar" > 0 AND "mevcutMiktar" <= 10) AS "lowStockProducts"\n      FROM "Product"\n    `;\n\n    const categoryStats = await prisma.product.groupBy({\n      by: ['kategori'],\n      _count: {\n        id: true\n      },\n      _sum: {\n        mevcutMiktar: true\n      }\n    });\n\n    res.json({\n      success: true,\n      data: {\n        totalProducts: Number(summary.totalProducts),\n        totalStockQuantity: Number(summary.totalStockQuantity),\n        totalStockValue: summary.totalStockValue,\n        lowStockProducts: Number(summary.lowStockProducts),\n        categoryStats\n      }\n    });\n\n  } catch (error) {\n    console.error('Get product stats error:', error);\n    res.status(500).json({\n      success: false,\n      message: 'İstatistikler getirilirken hata oluştu',\n      error: 'INTERNAL_ERROR'\n    });\n  }\n};\n'''
          replace_exact(controller, old_stats, new_stats)

          service = 'envanter_ui/src/services/api.ts'
          fetch_products = '''const fetchAllProducts = async (): Promise<Product[]> => {\n  const first = await apiService.products.getAll({ page: 1, limit: 100 });\n  const products = [...first.data.products];\n\n  for (let page = 2; page <= first.data.pagination.pages; page += 1) {\n    const response = await apiService.products.getAll({ page, limit: 100 });\n    products.push(...response.data.products);\n  }\n\n  return products;\n};\n\n'''
          replace_exact(service, fetch_products, '')

          old_dashboard = '''export const getDashboardStats = async () => {\n  const [products, movementPage] = await Promise.all([\n    fetchAllProducts(),\n    apiService.stockMovements.getAll({ page: 1, limit: 1 }),\n  ]);\n\n  const totalStockValue = products.reduce(\n    (sum, product) => sum + product.alisFiyati * product.mevcutMiktar,\n    0,\n  );\n\n  return {\n    success: true,\n    data: {\n      totalProducts: products.length,\n      totalStockValue,\n      totalMovements: movementPage.data.pagination.total,\n      lowStockProducts: products.filter(\n        (product) => product.mevcutMiktar > 0 && product.mevcutMiktar <= 10,\n      ).length,\n    },\n  };\n};\n'''
          new_dashboard = '''export const getDashboardStats = async () => {\n  const [productStats, movementPage] = await Promise.all([\n    apiService.products.getStats(),\n    apiService.stockMovements.getAll({ page: 1, limit: 1 }),\n  ]);\n\n  return {\n    success: true,\n    data: {\n      totalProducts: productStats.data.totalProducts,\n      totalStockValue: productStats.data.totalStockValue,\n      totalMovements: movementPage.data.pagination.total,\n      lowStockProducts: productStats.data.lowStockProducts,\n    },\n  };\n};\n'''
          replace_exact(service, old_dashboard, new_dashboard)

          test_file = Path('envanter_api/test/integration/money-decimal.test.js')
          text = test_file.read_text()
          marker = "test('inventory value aggregate uses exact decimal multiplication in PostgreSQL'"
          if marker in text:
              raise SystemExit('aggregate regression test already exists unexpectedly')

          aggregate_lines = [
              '',
              "test('inventory value aggregate uses exact decimal multiplication in PostgreSQL', async () => {",
              '  const create = async (code, purchasePrice) => {',
              "    const created = await api('/api/products', {",
              "      method: 'POST',",
              '      body: JSON.stringify({',
              '        urunKodu: code,',
              "        kategori: 'Decimal Aggregate',",
              '        alisFiyati: purchasePrice,',
              '        listeFiyati: purchasePrice,',
              '      }),',
              '    });',
              '    assert.equal(created.response.status, 201, JSON.stringify(created.body));',
              '    return created.body.data.product;',
              '  };',
              '',
              "  const first = await create('INT-DECIMAL-AGG-A', 0.10);",
              "  const second = await create('INT-DECIMAL-AGG-B', 0.20);",
              '',
              '  for (const [productId, quantity] of [[first.id, 3], [second.id, 7]]) {',
              "    const movement = await api('/api/stock-movements/manual', {",
              "      method: 'POST',",
              '      body: JSON.stringify({',
              '        productId,',
              "        movementType: 'GIRIS',",
              '        quantity,',
              '      }),',
              '    });',
              '    assert.equal(movement.response.status, 201, JSON.stringify(movement.body));',
              '  }',
              '',
              "  const stats = await api('/api/products/stats');",
              '  assert.equal(stats.response.status, 200, JSON.stringify(stats.body));',
              '  assert.equal(stats.body.data.totalStockQuantity, 10);',
              '  assert.equal(stats.body.data.totalStockValue, 1.7);',
              '  assert.equal(stats.body.data.lowStockProducts, 2);',
              '',
              '  const [exact] = await prisma.$queryRaw`',
              '    SELECT COALESCE(SUM("alisFiyati" * "mevcutMiktar"), 0)::numeric(20,2)::text AS "totalStockValue"',
              '    FROM "Product"',
              '  `;',
              "  assert.equal(exact.totalStockValue, '1.70');",
              '});',
              '',
          ]
          test_file.write_text(text + '\n'.join(aggregate_lines))
          PY

      - name: Verify backend dependencies and syntax
        working-directory: envanter_api
        run: |
          npm ci
          npm audit --omit=dev
          npm audit
          npx prisma generate
          node --check controllers/productController.js
          node --check test/integration/money-decimal.test.js

      - name: Verify UI
        working-directory: envanter_ui
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add envanter_api/controllers/productController.js envanter_api/test/integration/money-decimal.test.js envanter_ui/src/services/api.ts
          git diff --cached --check
          git commit -m "fix(stats): calculate inventory value with Decimal [skip ci]"
          git push origin HEAD:fix/decimal-inventory-aggregate
