name: Backend Integration

on:
  pull_request:
    paths:
      - 'envanter_api/**'
      - '.github/workflows/backend-integration.yml'
  push:
    branches:
      - main
    paths:
      - 'envanter_api/**'
      - '.github/workflows/backend-integration.yml'

jobs:
  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d inventory_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: envanter_api

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inventory_test?schema=public
      JWT_SECRET: integration-test-secret-with-sufficient-length
      JWT_EXPIRES_IN: 1h

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: envanter_api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply schema to disposable PostgreSQL
        run: npx prisma db push --skip-generate

      - name: Run backend integration tests
        run: npm test
