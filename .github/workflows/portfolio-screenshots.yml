name: Generate inventory portfolio screenshots

on:
  push:
    branches:
      - portfolio/16-dashboard-screenshots
    paths:
      - '.github/workflows/portfolio-screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inventory_portfolio
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d inventory_portfolio"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/inventory_portfolio?schema=public
      JWT_SECRET: portfolio-screenshot-secret-with-sufficient-length
      JWT_EXPIRES_IN: 1h
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: portfolio/16-dashboard-screenshots

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install API dependencies
        working-directory: envanter_api
        run: npm ci

      - name: Prepare database
        working-directory: envanter_api
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Start API
        working-directory: envanter_api
        run: |
          npm start > /tmp/stok-api.log 2>&1 &
          echo $! > /tmp/stok-api.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/stok-api.pid)" 2>/dev/null; then
              cat /tmp/stok-api.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/stok-api.log
          exit 1

      - name: Install UI dependencies
        working-directory: envanter_ui
        run: npm ci

      - name: Verify UI
        working-directory: envanter_ui
        run: |
          npm run typecheck
          npm run build

      - name: Install screenshot browser
        working-directory: envanter_ui
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start UI
        working-directory: envanter_ui
        env:
          VITE_API_URL: http://127.0.0.1:3001
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/stok-ui.log 2>&1 &
          echo $! > /tmp/stok-ui.pid
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/stok-ui.pid)" 2>/dev/null; then
              cat /tmp/stok-ui.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/stok-ui.log
          exit 1

      - name: Capture deterministic screenshots
        working-directory: envanter_ui
        run: node tools/portfolio-screenshots.mjs

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard.png docs/screenshots/products.png docs/screenshots/history.png
          git commit -m "docs: add inventory portfolio screenshots"
          git push origin HEAD:portfolio/16-dashboard-screenshots
